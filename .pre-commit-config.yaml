fail_fast: true
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: check
        name: format, lint, types, and tests
        entry: make check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: commitizen
        name: conventional commit message
        entry: uv run --locked cz check --commit-msg-file
        language: system
        stages: [commit-msg]
