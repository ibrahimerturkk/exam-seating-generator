[project]
name = "exam-seating-generator"
version = "0.1.0"
description = "Generate verified exam seating plans and combined door lists"
authors = [
    { name = "İbrahim Ertürk", email = "ibrahimerturk@msn.com" },
]
requires-python = ">=3.10,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
readme = "README.md"

dependencies = [
    "reportlab==4.4.9",
    "pypdf==6.10.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest-cov>=6.0.0",
    "pytest>=8.3.5",
    "commitizen>=4.4.1",
    "pre-commit>=4.2.0",
    "ruff>=0.11.0",
    "tox-uv>=1.25.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
# Like Black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",
    "A",  # flake8-builtins
    "B",  # flake8-bugbear
    "S",  # flake8-bandit
    "I",  # isort
    "UP", # pyupgrade
    "N",  # pep8-naming
]
ignore = ["S311"]  # Seeded random seating is intentional, not cryptography.

[tool.ruff.lint.extend-per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["generate", "seating", "configure", "exam_seating_generator"]
branch = true

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
files = ["generate.py", "seating.py", "configure.py", "exam_seating_generator", "tests"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version = "0.1.0"
version_provider = "uv"
version_files = [
    "pyproject.toml:version",
    "exam_seating_generator/__init__.py:__version__",
]
major_version_zero = true
update_changelog_on_bump = true
