[tox]
env_list = lint, type, py310, py311, py312

[testenv]
description = run tests
skip_install = true
deps =
    -r requirements.txt
    pytest>=8.3.5
    pytest-cov>=6.0.0
commands = python -m pytest {posargs:tests}

[testenv:lint]
description = check formatting and lint without changing files
deps = ruff>=0.11.0
commands =
    ruff format --check .
    ruff check .

[testenv:type]
description = check types
deps =
    {[testenv]deps}
    mypy>=1.15.0
commands = mypy
